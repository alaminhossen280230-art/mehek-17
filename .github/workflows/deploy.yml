name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: |
          find artifacts/space-warp/public -maxdepth 1 -type f | while read f; do
            d=$(dirname "$f"); b=$(basename "$f"); l=$(echo "$b" | tr '[:upper:]' '[:lower:]')
            [ "$b" != "$l" ] && cp -n "$f" "$d/$l" 2>/dev/null || true
          done
          find artifacts/space-warp/src -type f \( -name "*.tsx" -o -name "*.ts" \) -exec sed -i -E 's/(src|gif)( *= *| *: *)(["\x27`])\//\1\2\3.\//g' {} +
          node << 'EOF'
          const fs = require("fs");
          let h = fs.readFileSync("artifacts/space-warp/index.html", "utf8");
          h = h.replace(/<title>.*?<\/title>/, "<title>Happy Birthday Mehek! 🌸</title>").replace(/<link[^>]*rel="[^"]*icon[^"]*"[^>]*>/gi, "").replace("</head>", '<link rel="icon" type="image/png" href="./29a10c0c97b545a482e4033983bfd46e.png?v=5" /></head>');
          fs.writeFileSync("artifacts/space-warp/index.html", h);

          fs.writeFileSync("artifacts/space-warp/src/components/AmbientMusic.tsx", `import { useEffect, useRef } from "react";
          import { Phase } from "../App";
          export default function AmbientMusic({ phase }: { phase: Phase }) {
            const tRef = useRef<HTMLAudioElement | null>(null), sRef = useRef<HTMLAudioElement | null>(null), pRef = useRef(phase);
            pRef.current = phase;
            useEffect(() => {
              const t = new Audio("./travel.mp3"), s = new Audio("./space.mp3");
              t.preload = "auto"; s.preload = "auto"; s.loop = true; s.volume = 0.65;
              t.addEventListener("loadedmetadata", () => { if (t.currentTime < 5) t.currentTime = 5; }, { once: true });
              tRef.current = t; sRef.current = s;
              const play = () => {
                if (document.hidden) return;
                const p = pRef.current;
                if ((p === "warp" || p === "arriving") && t.paused && !t.ended) { if (t.currentTime < 5) t.currentTime = 5; t.play().catch(() => {}); }
                else if (p === "orbit" && s.paused) s.play().catch(() => {});
              };
              const vis = () => { if (document.hidden) { t.pause(); s.pause(); } else play(); };
              window.addEventListener("pointerdown", play); document.addEventListener("visibilitychange", vis);
              return () => { window.removeEventListener("pointerdown", play); document.removeEventListener("visibilitychange", vis); t.pause(); s.pause(); };
            }, []);
            useEffect(() => {
              const t = tRef.current, s = sRef.current; if (!t || !s) return;
              if (phase === "warp" || phase === "arriving") { s.pause(); if (!document.hidden && !t.ended) { if (t.currentTime < 5) t.currentTime = 5; t.play().catch(() => {}); } }
              else if (phase === "orbit") { t.pause(); if (!document.hidden) s.play().catch(() => {}); }
              else { t.pause(); s.pause(); }
            }, [phase]);
            return null;
          }`);

          const p = "artifacts/space-warp/src/pages/BirthdayPage.tsx";
          let c = fs.readFileSync(p, "utf8");
          c = c.replace(/setTimeout\s*\([^)]*doHappyBirthday[^;]*;/g, "")
               .replaceAll("audioRef.current = ctx;", 'if (ctx.state === "suspended") ctx.resume(); audioRef.current = ctx;')
               .replace("{audio:true}", "{audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}")
               .replace("analyRef.current.getByteFrequencyData(data);", "analyRef.current.getByteTimeDomainData(data);")
               .replace("const avg=data.reduce((a,b)=>a+b,0)/data.length;", "const avg=data.reduce((a,b)=>a+Math.abs(b-128),0)/data.length;")
               .replace(/78/g, "12").replace("frames>=8", "frames>=3")
               .replace("@keyframes creditsFade { 0% { opacity:0; } 100% { opacity:1; } }", "@keyframes creditsFade { 0% { opacity:0; } 100% { opacity:1; } } @keyframes toastSlide { 0% { transform: translateY(-140%); opacity: 0; } 7% { transform: translateY(0); opacity: 1; } 93% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-140%); opacity: 0; } }");

          const cakeSong = `const CAKE_DOT_COLORS = ["#ff85c2","#ffd700","#c084fc","#60c8f5"];
          useEffect(() => {
            if (showCreds) return;
            let alive = true, timer: any, ctx: AudioContext | null = null;
            const run = () => {
              if (!alive || document.hidden) return;
              try {
                if (!ctx) ctx = new (window.AudioContext || (window as any).webkitAudioContext)();
                if (ctx.state === "suspended") ctx.resume();
                const t = ctx.currentTime, notes = [[261.6,.25],[261.6,.25],[293.7,.5],[261.6,.5],[349.2,.5],[329.6,1],[261.6,.25],[261.6,.25],[293.7,.5],[261.6,.5],[392,.5],[349.2,1],[261.6,.25],[261.6,.25],[523.3,.5],[440,.5],[349.2,.5],[329.6,.5],[293.7,1],[466.2,.25],[466.2,.25],[440,.5],[349.2,.5],[392,.5],[349.2,1.5]];
                let e = 0;
                notes.forEach(([f, d]) => {
                  const o = ctx!.createOscillator(), g = ctx!.createGain();
                  o.connect(g); g.connect(ctx!.destination); o.frequency.value = f; o.type = "triangle";
                  g.gain.setValueAtTime(0, t + e); g.gain.linearRampToValueAtTime(0.12, t + e + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + e + d * 0.85);
                  o.start(t + e); o.stop(t + e + d); e += d * 0.52;
                });
                timer = setTimeout(run, (e + 1.2) * 1000);
              } catch {}
            };
            const vis = () => { if (document.hidden) { clearTimeout(timer); ctx?.suspend(); } else { ctx?.resume(); run(); } };
            document.addEventListener("visibilitychange", vis); run(); window.addEventListener("pointerdown", run, { once: true });
            return () => { alive = false; clearTimeout(timer); document.removeEventListener("visibilitychange", vis); window.removeEventListener("pointerdown", run); ctx?.close().catch(() => {}); };
          }, [showCreds]);`;

          const credHook = `function EndCredits() {
            useEffect(() => {
              const sfx = new Audio("./the%20end.mp3"), bgm = new Audio("./blind%20spots.mp3");
              bgm.loop = true; let started = false;
              const startBgm = () => { if (started || document.hidden) return; started = true; try { bgm.currentTime = 13; } catch {} bgm.play().catch(() => {}); };
              bgm.addEventListener("loadedmetadata", () => { bgm.currentTime = 13; }, { once: true });
              sfx.addEventListener("ended", startBgm, { once: true });
              const t1 = setTimeout(() => { if (!document.hidden) sfx.play().catch(() => startBgm()); }, 2000);
              const t2 = setTimeout(startBgm, 3600);
              const vis = () => { if (document.hidden) { sfx.pause(); bgm.pause(); } else if (started) bgm.play().catch(() => {}); };
              document.addEventListener("visibilitychange", vis);
              return () => { clearTimeout(t1); clearTimeout(t2); document.removeEventListener("visibilitychange", vis); sfx.pause(); bgm.pause(); };
            }, []);`;

          const skipBtn = '<button onClick={() => { blowOut(); setShowWish(true); setShowCreds(true); }} style={{ background: "rgba(255,255,255,0.45)", border: "1px solid rgba(180,50,90,0.35)", borderRadius: "50px", padding: "7px 22px", color: "#7a1840", fontSize: "12px", fontWeight: 700, cursor: "pointer", fontFamily: "system-ui" }}>Skip</button>';
          c = c.replace('const CAKE_DOT_COLORS = ["#ff85c2","#ffd700","#c084fc","#60c8f5"];', cakeSong)
               .replace("function EndCredits() {", credHook)
               .replace("{showCreds && <EndCredits/>}", '{showCreds && (<><EndCredits/><img src="./graduation-achievement-v0-0jaqu6i0po0b1.png" alt="Achievement Made! The End?" style={{position:"fixed",top:14,right:14,zIndex:999,width:"clamp(215px,62vw,310px)",height:"auto",imageRendering:"pixelated",boxShadow:"0 8px 24px rgba(0,0,0,0.75)",transform:"translateY(-140%)",opacity:0,animation:"toastSlide 9s cubic-bezier(0.22,1,0.36,1) 2s forwards",pointerEvents:"none"}} /></>)}')
               .replace("{!micActive && !micError && (", "{!micActive && !micError && (<>")
               .replace("🎤 Blow the candle!</button>", "🎤 Blow the candle!</button>" + skipBtn + "</>")
               .replace('transition:"width 0.05s linear"}}/>', 'transition:"width 0.05s linear"}}/></div>' + skipBtn + '<div style={{display:"none"}}>');
          fs.writeFileSync(p, c);
          EOF
      - run: pnpm --filter @workspace/space-warp build
        env:
          PORT: "3000"
          BASE_PATH: /mehek-17/
      - run: |
          mkdir -p artifacts/space-warp/dist/public/attached_assets
          cp -r attached_assets/* artifacts/space-warp/dist/public/attached_assets/ 2>/dev/null || true
          cp -rn attached_assets/* artifacts/space-warp/dist/public/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/space-warp/dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
