name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: |
          find artifacts/space-warp/src -type f \( -name "*.tsx" -o -name "*.ts" \) -exec sed -i 's|src="/|src="./|g' {} +
          find artifacts/space-warp/src -type f \( -name "*.tsx" -o -name "*.ts" \) -exec sed -i "s|src='/|src='./|g" {} +
      - run: pnpm --filter @workspace/space-warp build
        env:
          PORT: "3000"
          BASE_PATH: /Levi/
      - run: |
          mkdir -p artifacts/space-warp/dist/public/attached_assets
          cp -r attached_assets/* artifacts/space-warp/dist/public/attached_assets/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/space-warp/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
