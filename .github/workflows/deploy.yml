name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: |
          find artifacts/space-warp/src -type f \( -name "*.tsx" -o -name "*.ts" \) -exec sed -i -E 's/(src|gif)( *= *| *: *)(["\x27`])\//\1\2\3.\//g' {} +
          node -e '
            const fs = require("fs");
            const p = "artifacts/space-warp/src/pages/BirthdayPage.tsx";
            let c = fs.readFileSync(p, "utf8");
            c = c.replaceAll("audioRef.current = ctx;", "if (ctx.state === \"suspended\") ctx.resume(); audioRef.current = ctx;");
            c = c.replace("{audio:true}", "{audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}");
            c = c.replace("analyRef.current.getByteFrequencyData(data);", "analyRef.current.getByteTimeDomainData(data);");
            c = c.replace("const avg=data.reduce((a,b)=>a+b,0)/data.length;", "const avg=data.reduce((a,b)=>a+Math.abs(b-128),0)/data.length;");
            c = c.replace(/78/g, "12").replace("frames>=8", "frames>=3");
            c = c.replace("@keyframes creditsFade { 0% { opacity:0; } 100% { opacity:1; } }", "@keyframes creditsFade { 0% { opacity:0; } 100% { opacity:1; } } @keyframes toastSlide { 0% { transform: translateY(-140%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }");
            c = c.replace("animation:\"creditsFade 1.5s ease both\"}>", "animation:\"creditsFade 1.5s ease both\"}><img src=\"./graduation-achievement-v0-0jaqu6i0po0b1.png\" alt=\"Achievement Made! The End?\" style={{position:\"fixed\",top:14,right:14,zIndex:60,width:\"clamp(215px,62vw,310px)\",height:\"auto\",imageRendering:\"pixelated\",boxShadow:\"0 8px 24px rgba(0,0,0,0.75)\",animation:\"toastSlide 0.65s cubic-bezier(0.22,1,0.36,1) both\",pointerEvents:\"none\"}} />");
            const skipBtn = `<button onClick={() => { blowOut(); setShowWish(true); setShowCreds(true); }} style={{ background: "rgba(255,255,255,0.45)", border: "1px solid rgba(180,50,90,0.35)", borderRadius: "50px", padding: "7px 22px", color: "#7a1840", fontSize: "12px", fontWeight: 700, cursor: "pointer", fontFamily: "system-ui" }}>Skip</button>`;
            c = c.replace("{!micActive && !micError && (", "{!micActive && !micError && (<>");
            c = c.replace("🎤 Blow the candle!</button>", "🎤 Blow the candle!</button>" + skipBtn + "</>");
            c = c.replace("transition:\"width 0.05s linear\"}}/>", "transition:\"width 0.05s linear\"}}/></div>" + skipBtn + "<div style={{display:\"none\"}}>");
            fs.writeFileSync(p, c);
          '
      - run: pnpm --filter @workspace/space-warp build
        env:
          PORT: "3000"
          BASE_PATH: /mehek-17/
      - run: |
          mkdir -p artifacts/space-warp/dist/public/attached_assets
          cp -r attached_assets/* artifacts/space-warp/dist/public/attached_assets/ 2>/dev/null || true
          cp -rn attached_assets/* artifacts/space-warp/dist/public/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/space-warp/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
