name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: |
          find artifacts/space-warp/src -type f \( -name "*.tsx" -o -name "*.ts" \) -exec sed -i -E 's/(src|gif)( *= *| *: *)(["\x27`])\//\1\2\3.\//g' {} +
          sed -i 's/78/30/g' artifacts/space-warp/src/pages/BirthdayPage.tsx
          sed -i 's/frames>=8/frames>=4/g' artifacts/space-warp/src/pages/BirthdayPage.tsx
          sed -i 's|🎤 Blow the candle!</button>|🎤 Blow the candle!</button><button onClick={() => { blowOut(); setShowWish(true); setShowCreds(true); }} style={{ background: "rgba(255,255,255,0.45)", border: "1px solid rgba(180,50,90,0.35)", borderRadius: "50px", padding: "7px 20px", color: "#7a1840", fontSize: "12px", fontWeight: 700, cursor: "pointer", fontFamily: "system-ui" }}>Skip ⏭️</button>|g' artifacts/space-warp/src/pages/BirthdayPage.tsx
      - run: pnpm --filter @workspace/space-warp build
        env:
          PORT: "3000"
          BASE_PATH: /mehek-17/
      - run: |
          mkdir -p artifacts/space-warp/dist/public/attached_assets
          cp -r attached_assets/* artifacts/space-warp/dist/public/attached_assets/ 2>/dev/null || true
          cp -rn attached_assets/* artifacts/space-warp/dist/public/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/space-warp/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
